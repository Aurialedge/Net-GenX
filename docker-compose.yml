services:
  # Multi-tier Service 0A: Live MongoDB Database Engine
  mongodb:
    image: mongo:latest
    container_name: netgenx-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - netgenx-network
    restart: unless-stopped

  # Multi-tier Service 0B: Official Kubo IPFS Daemon Node (Peer-to-Peer Storage)
  ipfs-node:
    image: ipfs/kubo:latest
    container_name: netgenx-ipfs-node
    ports:
      - "4001:4001" # IPFS Swarm
      - "5001:5001" # IPFS RPC API
      - "8080:8080" # IPFS Gateway
    volumes:
      - ipfs-staging:/export
      - ipfs-data:/data/ipfs
    networks:
      - netgenx-network
    restart: unless-stopped

  # Multi-tier Service 1: Python AI Threat Inference Engine
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: netgenx-ml-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - ESCALATION_THRESHOLD=80
      - NETGENX_STATE_DIR=/app/state
    volumes:
      - ml-shield-state:/app/state
    networks:
      - netgenx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Multi-tier Service 2: IPFS Cryptographic Storage & Defence Security Gateway
  ipfs-gateway:
    build:
      context: ./ipfs
      dockerfile: Dockerfile
    container_name: netgenx-ipfs-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=netgenx_defence_cyber_shield_secret_key_2025
      - MONGODB=mongodb://mongodb:27017/netgenx
      - IPFS_API_URL=http://ipfs-node:5001
      - IPFS_GATEWAY_URL=http://ipfs-node:8080
      - ML_SERVICE_URL=http://ml-service:5000
      - BLOCKCHAIN_URL=http://blockchain-ledger:9000
    env_file:
      - path: ./ipfs/.env
        required: false
    depends_on:
      - mongodb
      - ipfs-node
      ml-service:
        condition: service_healthy
    volumes:
      - ipfs-vault-data:/app/vault_storage
    networks:
      - netgenx-network
    restart: unless-stopped

  # Multi-tier Service 3: Ethereum Smart Contract & Immutable Blockchain Ledger
  blockchain-ledger:
    build:
      context: ./block
      dockerfile: Dockerfile
    container_name: netgenx-blockchain-ledger
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    volumes:
      - blockchain-ledger-data:/app/data
    networks:
      - netgenx-network
    restart: unless-stopped

  # Multi-tier Service 4: React Cyber Incident Response Portal Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netgenx-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_IPFS_ADDRESS=localhost
      - VITE_IPFS_PORT=8000
      - VITE_BLOCK_ADDRESS=localhost
      - VITE_BLOCK_PORT=9000
      - VITE_ML_ADDRESS=localhost
      - VITE_ML_PORT=5000
    depends_on:
      - ipfs-gateway
      - blockchain-ledger
      - ml-service
    networks:
      - netgenx-network
    restart: unless-stopped

networks:
  netgenx-network:
    driver: bridge
    name: netgenx-network

volumes:
  mongodb-data:
    driver: local
  ipfs-staging:
    driver: local
  ipfs-data:
    driver: local
  ipfs-vault-data:
    driver: local
  blockchain-ledger-data:
    driver: local
  ml-shield-state:
    driver: local
